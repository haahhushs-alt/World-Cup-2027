name: Build unsigned iPad game
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  ipad:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sh ios/scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: World-Cup-2027-unsigned
          path: output/*.ipa
